<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>z-index and pseudo element</title>
    <style>
      .box {
        position: relative;
      }
      .ring {
        top: -60px;
      }
      .boy {
        z-index: 5;
      }
      .ring {
        z-index: 2;
      }
      .water {
        top: -145px;
      }
    </style>
  </head>
  <body>
    <h2>z-index</h2>
    <div class="swim-container">
      <div class="box boy"><img src="./img/boy.svg" alt="" /></div>
      <div class="box ring"><img src="./img/ring.svg" alt="" /></div>
      <div class="box water"><img src="./img/water.svg" alt="" /></div>
    </div>
  </body>
</html>
