<!DOCTYPE html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pseudo_class__elements_position</title>
    <style>
      h3:hover {
        color: rebeccapurple;
      }
      h3 {
        cursor: pointer;
      }

      input:focus {

      }

        font-size: 25px;
      }

    <input type="text" />
    <input type="text" />

    </ul>
