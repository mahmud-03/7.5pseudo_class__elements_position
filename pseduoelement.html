<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pseudoElements</title>
    <style>
      h3::after {
        content: " Islam";
        color: aqua;
      }
      h3::before {
        content: "Al ";
      }
      input::placeholder {
        color: blue;
      }
    </style>
  </head>
  <body>
    <h3>Mahmud</h3>

    <input type="text" placeholder="input your text" />
  </body>
</html>
